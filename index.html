<style>
#loading-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle, #1a9ad6 0%, #0d2a6e 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 1s ease;
  font-family: Segoe UI, Tahoma, sans-serif;
  color: white;
}
.loader-content { text-align: center; }

.win7-spinner {
  width: 50px; height: 50px;
  border: 4px solid rgba(255,255,255,0.3);
  border-top: 4px solid white;
  border-radius: 50%;
  margin: 0 auto 20px;
  animation: spin 1s linear infinite;
  box-shadow: 0 0 15px cyan;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
#loading-screen h2 {
  font-size: 42px;
  font-weight: 300;
  text-shadow: 0 0 10px white;
  margin: 0;
}
</style>

<script>
// Hilangin loading setelah 3 detik
window.addEventListener('load', () => {
  setTimeout(() => {
    const loader = document.getElementById('loading-screen');
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 1000);
  }, 3000); // 3000 = 3 detik
});
</script>
<!-- END LOADING SCREEN -->

<!-- GANTI NAMA FILE DI SINI -->
<audio id="myAudio" src="\sineis/Maid with the Flaxen Hair.mp3"></audio>

<div class="bar-tump">
  <button id="playBtn" type="button">play</button>
  <span>volume:</span>
  <input type="range" id="vol" min="0" max="100" value="50">
</div>

<script>
  const audio = document.getElementById('myAudio');
  const btn = document.getElementById('playBtn');
  const vol = document.getElementById('vol');

  btn.addEventListener('click', function() {
    if (audio.paused) {
      audio.play();
      btn.textContent = 'stop';
    } else {
      audio.pause();
      btn.textContent = 'play';
    }
  });

  vol.addEventListener('input', function() {
    audio.volume = this.value / 100;
  });
</script>
